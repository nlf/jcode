[package]
name = "jcode-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
dirs = "5"
jcode-core = { path = "../jcode-core" }
libc = "0.2"
rand = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by consumers through their `[dev-dependencies]`, which cargo compiles
# only for test targets. That is what makes the guard active for tests and
# structurally absent from every shipped binary, at every profile. See
# `src/test_guard.rs` for why this is a feature rather than `cfg!(test)`.
test-guard = []

[dev-dependencies]
tempfile = "3"
